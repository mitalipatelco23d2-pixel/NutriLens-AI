services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nutrilens-backend
    environment:
      NUTRILENS_MODEL_PATH: /opt/nutrilens/data/processed/health_score_model.joblib
      NUTRILENS_FRONTEND_DIR: /opt/nutrilens/frontend
      NUTRILENS_OCR_ENGINE: tesseract
      NUTRILENS_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/opt/nutrilens/data/processed:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
