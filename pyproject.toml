[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = [".venv"]

[[tool.mypy.overrides]]
module = [
    "pymongo.*",
    "neo4j.*",
    "redis.*",
    "cv2.*",
    "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "paddleocr.*",
    "easyocr.*",
    "ultralytics.*",
    "transformers.*",
    "torch.*",
    "duckdb",
    "duckdb.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "pyarrow",
    "pyarrow.*",
    "requests",
    "requests.*",
    "psutil",
    "yaml",
    "sentence_transformers.*",
    "faiss.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
